name: Generate Release Note

on:
  push:
    tags:
      - '*'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: 'true'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify package
        run: |
          bun audit --audit-level=high
          bun run lint
          bun run test:coverage
          bun run build
      # The npm CLI is only the registry client here: it provides trusted
      # publishing with provenance. Dependencies come from bun.lock.
      - name: Publish npm package
        run: npm publish --access public --provenance
      - name: Generate a changelog
        run: bun run release_note > ${{ github.workspace }}-CHANGELOG.txt
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'tribute.zip'
          directory: './dist/'
      - name: Generate release note
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          generate_release_notes: true
          files: 'dist/tribute.zip'
