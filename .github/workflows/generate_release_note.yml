name: Generate Release Note

on:
  push:
    tags:
      - '*'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Audit dependencies
        run: bun audit --audit-level=high
      - name: Test with configured coverage gate
        run: bun run test:coverage
      - name: Build package
        run: bun run build
      # The npm CLI is only the registry client here: it provides trusted
      # publishing with provenance. Dependencies come from bun.lock.
      - name: Publish npm package
        run: npm publish --access public --provenance
      - name: Generate a changelog
        run: bun run release_note > ${{ github.workspace }}-CHANGELOG.txt
      - name: Archive Release
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
        with:
          type: 'zip'
          filename: 'tribute.zip'
          directory: './dist/'
      - name: Generate release note
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          generate_release_notes: true
          files: 'dist/tribute.zip'
