version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
      time: "09:00"
    open-pull-requests-limit: 10

  # The actions in .github/workflows are pinned to commit SHAs; this keeps the SHAs and their version comments
  # current, in one pull request a week.
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
